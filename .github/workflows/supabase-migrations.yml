# RETIRED as an auto-apply pipeline (INFRA-FIX-MIGRATIONSWORKFLOW-RETIRE-1023-B12).
# Prod migration history diverges from supabase/migrations (21 files unmatched by
# version, ~57 remote versions without files), so `supabase db push` cannot run
# safely. Migrations are applied by the CTO via the Supabase connector after merge.
# Do not re-enable the push trigger before the history is reconciled.
name: Apply Supabase Migrations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# AUTOMATIC TRIGGER REMOVED (INFRA-FIX-MIGRATIONSWORKFLOW-MANUALONLY-1023-C03).
# Prod migration history is out of sync with this directory; `supabase db push` would re-apply migrations that are already live.
# Do NOT run this against prod until the history is reconciled. Prod migrations are applied via the Supabase connector (apply_migration); name the repo file with the version prod recorded.
on:
  workflow_dispatch:

jobs:
  apply-migrations:
    name: Apply pending migrations to prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: gzvixlvkwjsrtmtybtkf
      SUPABASE_POOLER_HOST: aws-1-us-east-2.pooler.supabase.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # session pooler (IPv4); direct host db.<ref>.supabase.co is IPv6-only and unreachable from GitHub runners.
      - name: Apply pending migrations
        run: supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${{ secrets.SUPABASE_DB_PASSWORD }}@${SUPABASE_POOLER_HOST}:5432/postgres"
