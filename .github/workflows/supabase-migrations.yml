name: Apply Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  apply-migrations:
    name: Apply pending migrations to prod
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: gzvixlvkwjsrtmtybtkf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply pending migrations
        run: supabase db push --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres"
