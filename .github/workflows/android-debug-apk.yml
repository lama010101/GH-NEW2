name: Android debug APK

on:
  push:
    branches:
      - 'build/android-debug-apk-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          set -o pipefail
          cd android && ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee ../gradle.log

      - name: Verify APK
        run: |
          set -u
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          fail=0
          err() { echo "::error::$1"; fail=1; }
          note() { echo "::notice::$1"; }

          if [ -f "$APK" ]; then
            note "APK exists: $APK"
            note "sha256: $(sha256sum "$APK" | awk '{print $1}')"
            note "size bytes: $(stat -c%s "$APK")"
          else
            err "APK missing at $APK"
          fi

          if grep -q ":app:processDebugGoogleServices" gradle.log; then
            note "processDebugGoogleServices ran: yes"
          else
            note "processDebugGoogleServices ran: no"
            err "gradle.log missing :app:processDebugGoogleServices"
          fi

          if [ -f "$APK" ]; then
            CAPJSON=$(unzip -p "$APK" assets/capacitor.config.json || true)
            note "assets/capacitor.config.json: $CAPJSON"
            echo "$CAPJSON" | grep -q "https://www.guess-history.com" || err "capacitor.config.json missing https://www.guess-history.com"

            AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
            PKG=$("$AAPT2" dump badging "$APK" | grep '^package:')
            note "badging package line: $PKG"
            echo "$PKG" | grep -q "name='com.backtothepast.app'" || err "badging package name is not com.backtothepast.app"
          fi

          [ "$fail" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: back-to-the-past-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
