# Manual deploy of the Cloudflare Worker "guess-history-ws" (see wrangler.jsonc).
# Runtime secrets (PARTYKIT_SECRET, SUPABASE_SECRET_KEY_PROD, SUPABASE_URL) are NOT
# handled by this workflow: the owner sets them once with `wrangler secret put`.
# Dry run (default) needs no Cloudflare credentials.
name: Deploy Worker (Cloudflare)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (bundle, do not deploy)'
        type: boolean
        default: true

jobs:
  deploy-worker:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required for a real deploy."
            exit 1
          fi

      - name: Wrangler deploy (dry run)
        if: ${{ inputs.dry_run }}
        run: npx wrangler deploy --dry-run

      - name: Wrangler deploy
        if: ${{ !inputs.dry_run }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
