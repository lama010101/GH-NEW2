name: Eval Model Rollups

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  compute-rollups:
    name: Compute per-model eval rollups (7d/30d/all)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute model rollups
        run: npx tsx scripts/ai-players/compute-model-rollups.ts
