name: secret-scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Blocking gate: secrets must not enter a commit range that reaches main.
  diff:
    name: diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Scan added lines for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx tsx scripts/dev/secret-scan.ts --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            npx tsx scripts/dev/secret-scan.ts --range "${{ github.event.before }}..${{ github.sha }}"
          fi

  # Non-blocking inventory: findings already tracked on main are expected
  # until the separate cleanup task lands; this job only reports them.
  tree:
    name: tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Report tracked-file findings
        run: npx tsx scripts/dev/secret-scan.ts --tree
