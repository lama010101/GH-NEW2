<!DOCTYPE html>

<title>Guess-History — Home Page Reference v2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #111; }

/* ── ROOT ─────────────────────────────────────── */
.root {
  width: 100vw; min-height: 100vh;
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow-x: hidden;
}

/* ── MOSAIC ───────────────────────────────────── */
.mosaic {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px; opacity: 0.32; z-index: 0;
}
.mc { overflow: hidden; }
.mc svg { width: 100%; height: 100%; display: block; }

/* ── OVERLAY ──────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 1;
  background: linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.62) 100%);
}

/* ── CONTENT LAYER ────────────────────────────── */
.content {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}

/* ── INNER WRAPPER (centers content, caps width) ─ */
.inner {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 14px 28px;
  display: flex; flex-direction: column; align-items: center;
}

/* ── TOP BAR ──────────────────────────────────── */
.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.xp-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.09);
  border: 0.5px solid rgba(255,255,255,0.18);
  border-radius: 20px; padding: 5px 12px;
  /* NO chevron — display only */
}
.xp-pill .acc { font-size: 13px; font-weight: 500; color: #fff; }
.xp-pill .pct { font-size: 10px; opacity: 0.55; }
.xp-pill .sep { color: rgba(255,255,255,0.28); font-size: 11px; }
.xp-pill .xpval { font-size: 13px; color: #f0c060; font-weight: 500; }
.xp-pill .xplbl { font-size: 10px; color: rgba(255,255,255,0.45); }

.topbar-right { display: flex; align-items: center; gap: 10px; }
.bell {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.09); border: 0.5px solid rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #c45 30%, #89b);
  border: 1.5px solid rgba(255,255,255,0.3); cursor: pointer;
}

/* ── LOGO ─────────────────────────────────────── */
.logo {
  font-size: 26px; font-weight: 700; letter-spacing: 1.5px;
  text-align: center;
  text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  margin-bottom: 20px;
}
.logo .w { color: #fff; }
.logo .p { color: #c084fc; }
.logo .o { color: #fb923c; }

/* ── CARDS ────────────────────────────────────── */
.cards {
  display: flex; gap: 10px; width: 100%;
}
.card {
  flex: 1; min-width: 0; border-radius: 14px; overflow: hidden;
  cursor: pointer; position: relative;
  outline: 3px solid transparent;
  transition: outline-color 0.18s, transform 0.15s;
}
.card.sel { outline-color: rgba(255,255,255,0.6); transform: translateY(-4px); }
.card:active { transform: scale(0.97); }

.art {
  width: 100%; aspect-ratio: 1/1;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.art svg {
  width: 72%; height: 72%;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}
.lbl { padding: 7px 5px 9px; text-align: center; }
.mname {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.1px; color: #fff; text-transform: uppercase;
}
.msub {
  font-size: 8px; font-weight: 500;
  letter-spacing: 0.8px; text-transform: uppercase;
  opacity: 0.6; color: #fff; margin-top: 2px;
}

/* Card themes */
.c-daily  .art { background: linear-gradient(145deg, #0d2a50, #1a3f7a); }
.c-daily  .lbl { background: #0d2040; }
.c-practice .art { background: linear-gradient(145deg, #7c3a0a, #d96b1a); }
.c-practice .lbl { background: #6a3008; }
.c-levelup .art { background: linear-gradient(145deg, #4a1a7a, #9b4dca); }
.c-levelup .lbl { background: #3a1060; }
.c-compete .art { background: linear-gradient(145deg, #0a4a3a, #1a9a7a); }
.c-compete .lbl { background: #093a2a; }

.live-badge {
  position: absolute; top: 7px; right: 7px;
  background: #ef4444; color: #fff; font-size: 7px; font-weight: 700;
  letter-spacing: 0.7px; text-transform: uppercase; border-radius: 5px; padding: 2px 5px;
}
.lvl-pip {
  position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.13); border: 0.5px solid rgba(255,255,255,0.3);
  border-radius: 8px; padding: 2px 7px; font-size: 8px; color: #fff; white-space: nowrap;
}

/* ── INFO PANEL ───────────────────────────────── */
.info {
  width: 100%; overflow: hidden;
  max-height: 0; opacity: 0; margin-top: 0;
  transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.25s ease;
}
.info.show { max-height: 240px; opacity: 1; margin-top: 12px; }

/* Practice */
.pset { display: flex; flex-direction: column; gap: 7px; width: 100%; }
.srow {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.11);
  border-radius: 10px; padding: 9px 13px;
}
.tog {
  width: 32px; height: 18px; border-radius: 9px;
  background: rgba(255,255,255,0.18); position: relative;
  cursor: pointer; transition: background 0.2s; flex-shrink: 0;
}
.tog.on { background: #22c55e; }
.tog::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; transition: left 0.15s;
}
.tog.on::after { left: 16px; }
.slbl { font-size: 12px; color: rgba(255,255,255,0.72); font-weight: 500; flex: 1; }
.sval { font-size: 12px; font-weight: 600; color: #fb923c; }
.sdim { font-size: 12px; color: rgba(255,255,255,0.3); margin: 0 3px; }
.pbtn {
  background: linear-gradient(135deg, #c05010, #f07820); color: #fff;
  border: none; border-radius: 10px; padding: 11px;
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; letter-spacing: 0.3px;
}

/* Daily */
.dpanel { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.dcountdown { font-size: 12px; color: #93c5fd; }
.ddot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ef4444; margin-right: 5px; vertical-align: middle; }
.dbtn {
  background: linear-gradient(135deg, #1a5cbf, #2a7aef); color: #fff;
  border: none; border-radius: 10px; padding: 11px;
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
}

/* Level Up */
.lpanel { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.lmeta { display: flex; justify-content: space-between; }
.lmeta-l { font-size: 11px; color: rgba(255,255,255,0.6); }
.lmeta-l strong { color: #c084fc; }
.lmeta-r { font-size: 11px; color: rgba(255,255,255,0.4); }
.lpbar { width: 100%; height: 7px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
.lpfill { height: 100%; width: 55%; background: linear-gradient(90deg, #9b4dca, #c084fc); border-radius: 4px; }
.lpills { display: flex; gap: 7px; }
.lpill { flex: 1; background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.11); border-radius: 9px; padding: 7px 8px; text-align: center; }
.pllbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.4); margin-bottom: 2px; }
.plval { font-size: 12px; font-weight: 600; color: #c084fc; }
.lbtn {
  background: linear-gradient(135deg, #6020a0, #9b4dca); color: #fff;
  border: none; border-radius: 10px; padding: 11px;
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
}

/* Compete */
.cpanel { display: flex; flex-direction: column; gap: 7px; width: 100%; }
.copts { display: flex; gap: 7px; }
.copt {
  flex: 1; border-radius: 9px; padding: 9px 6px; text-align: center; cursor: pointer;
  border: 0.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.07);
  transition: background 0.15s, border-color 0.15s;
}
.copt.on { background: rgba(26,154,122,0.25); border-color: rgba(26,154,122,0.6); }
.cotlbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.7px; color: rgba(255,255,255,0.5); margin-bottom: 2px; }
.cotval { font-size: 12px; font-weight: 600; color: #fff; }
.cbtn {
  background: linear-gradient(135deg, #0a5a40, #1a9a7a); color: #fff;
  border: none; border-radius: 10px; padding: 11px;
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
}
</style>

      <span class="sval">655</span><span class="sdim">—</span><span class="sval">2025</span>
    </div>
    <button class="pbtn">Start Practice</button>
  </div>`,
  levelup: `<div class="lpanel">
    <div class="lmeta">
      <span class="lmeta-l">Level <strong>5</strong> → Level <strong>6</strong></span>
      <span class="lmeta-r">Min accuracy: 52%</span>
    </div>
    <div class="lpbar"><div class="lpfill"></div></div>
    <div class="lpills">
      <div class="lpill"><div class="pllbl">Year range</div><div class="plval">1776–2025</div></div>
      <div class="lpill"><div class="pllbl">Timer</div><div class="plval">4:50</div></div>
      <div class="lpill"><div class="pllbl">Rounds</div><div class="plval">5</div></div>
    </div>
    <button class="lbtn">Start Level 5</button>
  </div>`,
  compete: `<div class="cpanel">
    <div class="copts">
      <div class="copt on" onclick="copt(this)"><div class="cotlbl">Create lobby</div><div class="cotval">New game</div></div>
      <div class="copt" onclick="copt(this)"><div class="cotlbl">Join with code</div><div class="cotval">Enter code</div></div>
    </div>
    <button class="cbtn">Go to Lobby</button>
  </div>`
};

function sel(mode) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('sel'));
  document.querySelector('[data-mode="'+mode+'"]').classList.add('sel');
  const info = document.getElementById('info');
  const panel = document.getElementById('panel');
  info.classList.remove('show');
  setTimeout(() => { panel.innerHTML = panels[mode]; info.classList.add('show'); }, 180);
}

function copt(el) {
  document.querySelectorAll('.copt').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
}

// Default: Practice
document.getElementById('panel').innerHTML = panels.practice;
</script>
