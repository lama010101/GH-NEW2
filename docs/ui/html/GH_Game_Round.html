<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess History — Round</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;display:flex;align-items:flex-start;justify-content:center;background:#111;}
.phone{width:100%;max-width:420px;min-height:100vh;position:relative;background:#1a1a1a;display:flex;flex-direction:column;}
.photo{position:relative;width:100%;height:280px;background:#111;overflow:hidden;flex-shrink:0;}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.topbar{position:absolute;top:0;left:0;right:0;padding:12px 14px 0;display:flex;align-items:center;justify-content:space-between;z-index:10;}
.score-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:6px 13px;font-size:13px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.score-pill .acc-pct{color:#f87171;font-weight:800;font-size:15px}
.score-pill .acc-label{display:none}
.timer-pill{display:inline-flex;align-items:center;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:6px 13px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.timer-pill.urgent{border-color:#ef4444;color:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.4);animation:tpulse .7s ease-in-out infinite;}
@keyframes tpulse{0%,100%{box-shadow:0 0 10px rgba(239,68,68,.35)}50%{box-shadow:0 0 20px rgba(239,68,68,.65)}}
.avatars{display:flex;align-items:center;flex-direction:row-reverse;}
.av-wrap{position:relative;margin-left:-8px;flex-shrink:0;}
.av-wrap:last-child{margin-left:0;}
.av{width:27px;height:27px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;border:2px solid rgba(20,20,20,0.9);}
.av.playing{outline:2px solid #22c55e;outline-offset:1px;}
.av.done{outline:2px solid #14b8a6;outline-offset:1px;filter:brightness(.45) saturate(.2);}
.av-check-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,180,160,.25);display:flex;align-items:center;justify-content:center;}
.av-check-overlay svg{width:11px;height:11px;}
.av-name{display:none;}
.av-done-label{display:none;}
.fsbtn{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#fb923c;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(251,146,60,.5);}
.fsbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.content{flex:1;background:#1a1a1a;display:flex;flex-direction:column;padding-bottom:90px;}
.card{background:#252525;margin:10px 12px 0;border-radius:12px;padding:13px 14px;border:1px solid rgba(255,255,255,0.07);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-label{display:inline-flex;align-items:center;gap:7px;color:#fb923c;font-size:13px;font-weight:600;}
.card-label svg{width:14px;height:14px;stroke:rgba(255,255,255,.45);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.card-answer{color:#fb923c;font-size:13px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%;}
.card-year{color:#fb923c;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
.search-bar{margin-top:11px;display:flex;align-items:center;gap:8px;background:#1e1e1e;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 12px;height:40px;}
.search-bar svg{width:15px;height:15px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px;font-family:inherit;}
.search-bar input::placeholder{color:rgba(255,255,255,.35);}
.map-thumb{position:relative;margin-top:10px;width:100%;height:110px;border-radius:9px;overflow:hidden;background:#b8d4dc;cursor:pointer;border:1px solid rgba(255,255,255,0.06);}
.map-tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.52);color:#fff;font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:999px;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.12);z-index:2;}
.pin-marker{position:absolute;transform:translate(-50%,-100%);width:26px;height:26px;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));z-index:3;}
.slider-outer{margin-top:14px;padding:0 2px;}
.tick-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.tick-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.tick-mark{width:1px;height:6px;background:rgba(255,255,255,.3);}
.tick-lbl{font-size:10px;color:rgba(255,255,255,.4);font-weight:500;}
.slider-track-wrap{position:relative;height:22px;cursor:pointer;touch-action:none;}
.slider-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:3px;background:rgba(255,255,255,.15);border-radius:2px;}
.slider-thumb{position:absolute;top:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:50%;background:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.25),0 2px 6px rgba(0,0,0,.5);cursor:grab;}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:#1e1e1e;border-radius:7px;padding:3px;margin-top:10px;}
.seg button{border:none;background:transparent;color:rgba(255,255,255,.4);font-size:11px;font-weight:600;letter-spacing:.05em;padding:8px 0;border-radius:5px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
.seg button.active{background:#d1d5db;color:#111;font-weight:700;}
.bottom{position:fixed;bottom:0;width:100%;max-width:420px;background:#252525;border-top:1px solid rgba(255,255,255,0.07);padding:10px 14px 18px;display:flex;align-items:center;gap:9px;z-index:20;}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.hints-btn{flex:1;height:46px;border-radius:23px;border:none;background:linear-gradient(90deg,#b794f4 0%,#f9a8d4 25%,#fca5a5 50%,#fcd34d 75%,#86efac 100%);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;}
.hints-badge{background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
.submit-btn{flex:1.2;height:46px;border-radius:23px;border:none;background:#fb923c;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 16px rgba(251,146,60,.45);transition:opacity .15s,transform .1s;}
.submit-btn:active{transform:scale(.97);}
.submit-btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.img-modal{display:none;position:fixed;inset:0;background:#000;z-index:200;align-items:center;justify-content:center;}
.img-modal.open{display:flex;}
.img-modal img{max-width:100%;max-height:100%;object-fit:contain;}
.map-modal{display:none;position:fixed;inset:0;background:#080808;z-index:200;flex-direction:column;}
.map-modal.open{display:flex;}
.map-modal-inner{flex:1;position:relative;overflow:hidden;background:#b8d4dc;cursor:crosshair;}
.map-modal-inner svg{width:100%;height:100%;display:block;}
.map-modal-bottom{padding:14px 16px 20px;background:#111;display:flex;align-items:center;justify-content:space-between;}
.map-modal-label{font-size:13px;color:rgba(255,255,255,.5);}
.map-modal-confirm{height:42px;padding:0 28px;border-radius:21px;border:none;background:#fb923c;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 12px rgba(251,146,60,.4);}
.close-btn{position:absolute;top:14px;right:14px;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
</style>
</head>

function fullMapSVG(){return'<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;position:absolute;inset:0"><defs><linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8dfe8"/><stop offset="100%" stop-color="#aecfda"/></linearGradient><pattern id="g4" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0L0 0 0 60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/></pattern></defs><rect width="800" height="500" fill="url(#s4)"/><rect width="800" height="500" fill="url(#g4)"/><g fill="#ede8df" stroke="rgba(0,0,0,0.07)" stroke-width="1"><path d="M200,320 Q180,295 198,270 Q225,255 258,270 Q278,295 274,328 Q258,352 234,353 Q206,350 200,320Z"/><path d="M274,210 Q308,185 360,188 Q410,188 438,210 Q464,232 468,268 Q456,305 438,316 Q400,330 360,323 Q318,316 296,295 Q274,270 274,210Z"/><path d="M258,135 Q278,120 294,135 Q300,158 294,182 Q278,196 266,182 Q252,158 258,135Z"/><path d="M390,65 Q416,55 442,65 Q452,88 445,128 Q428,158 408,150 Q396,126 392,100 Q386,80 390,65Z"/><path d="M412,268 Q424,268 432,292 Q436,320 428,346 Q416,354 412,340 Q408,314 408,292Z"/><path d="M468,188 Q548,178 628,205 Q666,224 662,272 Q646,312 588,320 Q528,317 484,292 Q462,252 468,188Z"/><path d="M446,316 Q490,324 514,350 Q506,380 480,376 Q450,360 446,316Z"/><path d="M200,408 Q306,396 400,410 Q510,418 620,415 L800,418 L800,500 L0,500 L0,422 Q100,405 200,408Z"/><path d="M628,90 Q710,76 800,92 L800,238 Q708,252 668,242 Q642,200 628,148 Q620,110 628,90Z"/></g><text x="390" y="290" text-anchor="middle" fill="rgba(80,80,80,0.28)" font-family="Inter,sans-serif" font-weight="800" font-size="44" letter-spacing="10">EUROPE</text></svg>';}

function pinSVG(id){return'<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:26px;height:26px"><defs><linearGradient id="pg'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#ea580c"/></linearGradient></defs><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="url(#pg'+id+')" stroke="rgba(0,0,0,0.2)" stroke-width="0.7"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg>';}

document.getElementById('mapThumb').insertAdjacentHTML('afterbegin',thumbMapSVG());
document.getElementById('mapModalInner').insertAdjacentHTML('afterbegin',fullMapSVG());

var TICKS=[1000,1600,1700,1800,1900,2000],YEAR_MIN=1000,YEAR_MAX=2025;
var row=document.getElementById('tickRow');
TICKS.forEach(function(t){var d=document.createElement('div');d.className='tick-item';d.innerHTML='<div class="tick-mark"></div><div class="tick-lbl">'+t+'</div>';row.appendChild(d);});

var S={year:2000,pin:null,mPin:null};
function pct(y){return((y-YEAR_MIN)/(YEAR_MAX-YEAR_MIN))*100;}
(function(){
  var wrap=document.getElementById('sliderWrap'),dragging=false;
  function fromX(cx){var r=wrap.getBoundingClientRect();var p=Math.max(0,Math.min(1,(cx-r.left)/r.width));S.year=Math.round(YEAR_MIN+p*(YEAR_MAX-YEAR_MIN));document.getElementById('sliderThumb').style.left=pct(S.year)+'%';document.getElementById('yearDisplay').textContent=S.year;}
  wrap.addEventListener('mousedown',function(e){dragging=true;fromX(e.clientX);});
  wrap.addEventListener('touchstart',function(e){dragging=true;fromX(e.touches[0].clientX);},{passive:true});
  window.addEventListener('mousemove',function(e){if(dragging)fromX(e.clientX);});
  window.addEventListener('touchmove',function(e){if(dragging)fromX(e.touches[0].clientX);},{passive:true});
  window.addEventListener('mouseup',function(){dragging=false;});
  window.addEventListener('touchend',function(){dragging=false;});
})();

function setScale(v){document.querySelectorAll('#segCtrl button').forEach(function(b){b.classList.toggle('active',b.textContent===v);});}

document.getElementById('mapThumb').addEventListener('click',function(e){
  var rect=this.getBoundingClientRect();
  S.pin={x:((e.clientX-rect.left)/rect.width)*100,y:((e.clientY-rect.top)/rect.height)*100};
  document.getElementById('mapTip').style.display='none';
  var old=document.getElementById('thumbPin');if(old)old.remove();
  var el=document.createElement('div');el.id='thumbPin';el.className='pin-marker';el.style.left=S.pin.x+'%';el.style.top=S.pin.y+'%';el.innerHTML=pinSVG('t');
  this.appendChild(el);
  document.getElementById('mapModal').classList.add('open');
});

document.getElementById('mapModalInner').addEventListener('click',function(e){
  if(e.target.closest('.close-btn'))return;
  var rect=this.getBoundingClientRect();
  S.mPin={x:((e.clientX-rect.left)/rect.width)*100,y:((e.clientY-rect.top)/rect.height)*100};
  var old=document.getElementById('modalPin');if(old)old.remove();
  var el=document.createElement('div');el.id='modalPin';el.className='pin-marker';el.style.left=S.mPin.x+'%';el.style.top=S.mPin.y+'%';el.innerHTML=pinSVG('m');
  this.appendChild(el);
});

function confirmMapModal(){
  if(S.mPin){S.pin=S.mPin;var old=document.getElementById('thumbPin');if(old)old.remove();var el=document.createElement('div');el.id='thumbPin';el.className='pin-marker';el.style.left=(S.pin.x/2.5)+'%';el.style.top=(S.pin.y/2.5)+'%';el.innerHTML=pinSVG('t2');document.getElementById('mapThumb').appendChild(el);document.getElementById('mapTip').style.display='none';}
  document.getElementById('mapModal').classList.remove('open');
}

document.getElementById('photoFsBtn').addEventListener('click',function(){document.getElementById('imgModal').classList.add('open');});

(function(){
  var total=3*60+28;
  function render(){var m=Math.floor(total/60),s=total%60;document.getElementById('timerPill').textContent=m+':'+(s<10?'0':'')+s;document.getElementById('timerPill').className='timer-pill'+(total<10?' urgent':'');}
  render();
  setInterval(function(){if(total>0){total--;render();}},1000);
})();
<\/script>
