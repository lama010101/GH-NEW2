<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess History — Round</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #fb923c;
      --orange-dark: #c2620a;
      --red: #ef4444;
      --gold: #f0c060;
      --green: #22c55e;
      --teal: #14b8a6;
      --surface: #1a1a1a;
      --surface-2: #242424;
      --border: rgba(255,255,255,0.08);
      --text-primary: #ffffff;
      --text-muted: rgba(255,255,255,0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Stage holds the iOS frame centered on a dark backdrop */
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 30% 20%, rgba(251,146,60,0.06), transparent 60%),
        radial-gradient(circle at 70% 80%, rgba(192,132,252,0.05), transparent 60%),
        #0a0a0a;
    }

    /* App fills the frame's viewport */
    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e0e0e;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    .scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 88px;
      -webkit-overflow-scrolling: touch;
    }

    /* ---------- TOP BAR ---------- */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      line-height: 1;
    }
    .score-pill .acc { color: #fff; font-weight: 600; }
    .score-pill .sep { color: var(--text-muted); font-size: 10px; }
    .score-pill .xp-icon { color: var(--gold); display: inline-flex; }
    .score-pill .xp { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }

    .timer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--orange);
      font-variant-numeric: tabular-nums;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 4px 10px;
    }
    .timer.urgent {
      color: var(--red);
      box-shadow: 0 0 8px rgba(239,68,68,0.6);
      animation: pulse 600ms ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-50%) scale(1.05); }
    }
    .timer svg { width: 14px; height: 14px; }

    .avatars {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
    }
    .avatar {
      position: relative;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      overflow: visible;
      margin-left: -8px; /* overlap (rightmost on top because of row-reverse + DOM order) */
      background: #333;
      flex: 0 0 auto;
    }
    .avatar:first-child { margin-left: 0; }
    .avatar .pic {
      width: 100%; height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
      transition: filter 200ms;
    }
    .avatar.submitted .pic { filter: brightness(0.6); }
    .avatar.submitted { outline: 2px solid var(--teal); outline-offset: 1px; border-radius: 50%; }
    .avatar .dot {
      position: absolute;
      bottom: -1px; right: -1px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      border: 1.5px solid #1a1a1a;
    }
    .avatar.submitted .dot { background: var(--teal); }

    /* ---------- PHOTO ---------- */
    .photo {
      position: relative;
      width: 100%;
      height: min(55vw, 260px);
      background: #111;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .fs-btn {
      position: absolute;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      border: 0;
      cursor: pointer;
    }
    .photo .fs-btn { bottom: 10px; right: 10px; }
    .fs-btn svg { width: 16px; height: 16px; }

    /* The reference shows a large orange marker over the image. The spec
       calls for a small circular fullscreen button, so we match the spec. */

    /* ---------- CARDS ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .card.where { margin: 12px 16px 0; }
    .card.when { margin: 8px 16px 0; }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-head .left {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--orange); font-size: 13px; font-weight: 600;
    }
    .card-head .left svg { width: 14px; height: 14px; }
    .card-head .right {
      color: var(--orange); font-size: 13px; font-weight: 500;
      text-align: right;
    }
    .card.when .card-head .right {
      font-size: 18px; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Search */
    .search {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      height: 36px;
    }
    .search svg { width: 14px; height: 14px; color: var(--text-muted); flex: 0 0 auto; }
    .search input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }
    .search input::placeholder { color: var(--text-muted); }

    /* Map thumbnail */
    .map-thumb {
      position: relative;
      margin-top: 10px;
      width: 100%;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      background: #b9d4dc;
      cursor: pointer;
    }
    .map-thumb svg.map-bg { width: 100%; height: 100%; display: block; }
    .map-overlay {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
    }
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
    }
    .map-pin svg { width: 24px; height: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

    /* ---------- WHEN slider ---------- */
    .slider-wrap {
      margin-top: 14px;
      padding: 0 4px;
    }
    .ticks {
      position: relative;
      height: 18px;
      display: flex;
      justify-content: space-between;
    }
    .tick {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted);
      font-size: 9px;
      line-height: 1;
      gap: 3px;
    }
    .tick .mark {
      width: 1px; height: 5px; background: var(--text-muted); opacity: 0.6;
    }
    .tick .label { font-size: 9px; }

    .slider {
      position: relative;
      height: 18px;
      margin-top: 2px;
      touch-action: none;
    }
    .track {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: var(--orange);
      border-radius: 2px;
    }
    .thumb {
      position: absolute;
      top: 50%;
      width: 18px; height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: grab;
    }
    .thumb:active { cursor: grabbing; }

    /* Scale toggle */
    .seg {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--surface-2);
      border-radius: 6px;
      padding: 3px;
      gap: 0;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 7px 0;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: background 150ms, color 150ms;
    }
    .seg button.active {
      background: var(--orange);
      color: var(--text-primary);
      font-weight: 700;
    }

    /* ---------- BOTTOM BAR ---------- */
    .bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .icon-btn svg { width: 18px; height: 18px; }

    .hints {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      border-radius: 22px;
      padding: 0 18px;
      background: linear-gradient(135deg, #c084fc 0%, #fb923c 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .hints .badge {
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .submit {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      border-radius: 22px;
      padding: 0 24px;
      background: var(--orange);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 2px 12px rgba(251,146,60,0.4);
      transition: background 120ms, box-shadow 120ms, transform 100ms;
    }
    .submit:active { background: var(--orange-dark); transform: scale(0.98); }
    .submit svg { width: 15px; height: 15px; }
    .submit.disabled {
      background: rgba(251,146,60,0.3);
      color: rgba(255,255,255,0.35);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ---------- MODALS ---------- */
    .modal {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      z-index: 50;
      display: flex;
      flex-direction: column;
      animation: slideUp 220ms ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      background: #0a0a0a;
      border-bottom: 1px solid var(--border);
    }
    .close-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 0;
      color: #fff;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      font-size: 18px;
    }
    .modal-search {
      flex: 1;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      height: 36px;
    }
    .modal-search svg { width: 14px; height: 14px; color: var(--text-muted); }
    .modal-search input {
      flex: 1; background: transparent; border: 0; outline: 0;
      color: #fff; font-size: 13px; font-family: inherit;
    }
    .modal-search input::placeholder { color: var(--text-muted); }

    .modal-map {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #b9d4dc;
      cursor: crosshair;
    }
    .modal-map svg.map-bg { width: 100%; height: 100%; display: block; }

    .modal-when {
      position: absolute;
      left: 12px; right: 12px; bottom: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .modal-confirm {
      position: absolute;
      left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      height: 48px;
      border-radius: 24px;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      border: 0;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(251,146,60,0.4);
      font-family: inherit;
    }
    .modal-confirm.disabled {
      background: rgba(251,146,60,0.3);
      color: rgba(255,255,255,0.35);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Settings sheet */
    .sheet-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 60;
      animation: fadeIn 200ms ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      animation: sheetUp 240ms cubic-bezier(.2,.7,.2,1);
      z-index: 61;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet h3 { margin: 4px 0 12px; font-size: 16px; font-weight: 700; }
    .sheet .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .sheet .row:last-child { border-bottom: 0; }
    .sheet .row .lbl { color: #fff; }
    .sheet .row .val { color: var(--text-muted); font-size: 13px; }
    .sheet .grabber {
      width: 40px; height: 4px; background: rgba(255,255,255,0.2);
      border-radius: 2px; margin: -4px auto 12px;
    }

    /* Image modal */
    .image-modal {
      position: absolute; inset: 0;
      background: #000;
      z-index: 70;
      display: flex; align-items: center; justify-content: center;
    }
    .image-modal img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    .image-modal .close-btn {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
    }

    /* Hide scrollbar in webkit */
    .scroll::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="map-svg.jsx"></script>
  <script type="text/babel" src="game.jsx"></script>
</body>
</html>
